name: Build

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build cursor helper
        shell: powershell
        run: .\build.ps1

      - name: Upload Windows helper
        uses: actions/upload-artifact@v4
        with:
          name: PaperPlaneGlowClick
          path: dist\PaperPlaneGlowClick.exe
          if-no-files-found: error